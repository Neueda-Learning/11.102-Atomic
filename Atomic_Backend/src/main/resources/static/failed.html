<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Atomic transaction failed">
    <title>Transfer failed | Atomic</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-result="failed">
<main class="result-shell">
    <section class="result-card" aria-labelledby="result-heading">
        <div class="result-card__hero">
            <span class="result-mark result-mark--failed" aria-hidden="true">!</span>
            <p class="eyebrow">We couldn’t complete your transfer</p>
            <h1 id="result-heading">Transfer failed.</h1>
            <p class="result-copy">Your transfer wasn’t completed. Review the details below, then try again when you’re ready.</p>
        </div>

        <section class="batch-result" id="batch-result" hidden>
            <p class="batch-result__summary" id="batch-result-summary"></p>
            <div class="batch-result-list" id="batch-result-list"></div>
        </section>

        <dl class="detail-list result-details" id="single-result">
            <div><dt>Transaction reference</dt><dd id="result-id">—</dd></div>
            <div><dt>Amount</dt><dd id="result-amount">—</dd></div>
            <div><dt>From</dt><dd id="result-debit">—</dd></div>
            <div><dt>To</dt><dd id="result-credit">—</dd></div>
            <div><dt>Transfer status</dt><dd id="result-status" class="badge badge--failed">Failed</dd></div>
        </dl>

        <div class="result-tools" aria-label="Receipt tools">
            <button id="copy-reference" class="button button--ghost" type="button">Copy reference</button>
            <button id="print-receipt" class="button button--ghost" type="button">Print receipt</button>
            <span id="result-feedback" class="result-feedback" aria-live="polite"></span>
        </div>

        <div class="result-actions">
            <a class="button button--primary" href="/transaction.html">Try another transfer</a>
            <a class="button button--secondary" href="/dashboard.html">Return to dashboard</a>
            <a class="button button--secondary" href="/transactions.html">View history</a>
        </div>
    </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/result.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Atomic transfer batch processing status">
    <title>Processing transfers | Atomic</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="processing-shell">
    <section class="processing-card processing-card--batch" aria-labelledby="processing-heading" aria-live="polite">
        <header class="processing-card__head">
            <div>
                <p class="eyebrow">We’re keeping track</p>
                <h1 id="processing-heading">Processing your transfers.</h1>
                <p id="processing-copy">We’re checking the progress of each transfer for you…</p>
            </div>
            <span class="badge badge--created" id="overall-status">Created</span>
        </header>

        <div class="batch-summary">
            <div><span>Total</span><strong id="batch-total">0</strong></div>
            <div><span>Queued / processing</span><strong id="batch-pending">0</strong></div>
            <div><span>Completed</span><strong id="batch-completed">0</strong></div>
            <div><span>Failed</span><strong id="batch-failed">0</strong></div>
        </div>

        <div class="batch-processing-list" id="batch-processing-list">
            <div class="history-empty">
                <strong>Finding your transfers</strong>
                <span>We’re checking their latest progress now.</span>
            </div>
        </div>

        <div class="poll-note" id="poll-note">
            <span class="spinner" aria-hidden="true"></span>
            <span id="poll-message">Checking for updates…</span>
        </div>

        <div class="processing-actions">
            <button class="button button--secondary" id="retry-status" type="button" hidden>Check again</button>
            <a class="button button--ghost" href="/dashboard.html">View dashboard</a>
            <a class="button button--ghost" href="/transaction.html">Create another batch</a>
        </div>
    </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/processing.js"></script>
</body>
</html>
